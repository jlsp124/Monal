# Unsigned testing package. A compatible signer must sign the app, frameworks and
# extensions with matching App Group/keychain capabilities before installation.
workflows:
  monal-ios-unsigned:
    name: Monal Alpha - unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Fetch committed submodules
        script: |
          set -euo pipefail
          git submodule update --init --recursive
          if command -v git-lfs >/dev/null 2>&1; then git lfs pull; fi
      - name: Generate Rust bridge
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          bash rust/build-rust.sh
      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd Monal
          pod install --repo-update
      - name: Build and validate device application
        script: bash scripts/build-ios-testing.sh iphoneos
      - name: Package application without editing binaries or metadata
        script: bash scripts/package-ios-testing.sh
    artifacts:
      - build/ios-testing/ipa/*.ipa
      - build/ios-testing/DerivedData/Build/Products/Alpha-iphoneos/*.app
      - build/*-build.log
