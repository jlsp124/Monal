name: Run automated tests

on:
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - quicksy
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      validation:
        description: Validation to run on this branch
        type: choice
        default: tests
        options: [tests, launch, integration]

permissions: {}

jobs:
  run_tests:
    if: github.event_name != 'workflow_dispatch' || inputs.validation != 'launch'
    runs-on: macos-15
    name: Run automated tests
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: true
          fetch-depth: 1000
          fetch-tags: true
          show-progress: true
          lfs: true
      - name: Checkout submodules
        run: git submodule update -f --init --remote
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - name: Install coreutils
        run: brew install coreutils
      - name: Build rust
        run: bash ./rust/build-rust.sh
      - name: Install pods
        working-directory: Monal
        run: pod install --repo-update
      - name: Run tests
        working-directory: Monal
        run: |
          mkdir -p "$RUNNER_TEMP/test-artifacts"
          set -o pipefail && \
          NSUnbufferedIO=YES xcodebuild \
            -workspace Monal.xcworkspace \
            -scheme Monal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/test-artifacts/TestResults.xcresult" \
            test \
            2>&1 | \
          tee "$RUNNER_TEMP/test-artifacts/xcodebuild.log" | \
          stdbuf -oL -eL xcbeautify --renderer github-actions | \
          while IFS= read -r line; do \
            echo "$line"; \
            if [[ "$line" =~ "✔" ]]; then \
              echo "::notice ::${line}"; \
            fi; \
          done
      - name: Collect crash reports
        if: ${{ !cancelled() }}
        run: |
          if [ -d ~/Library/Logs/DiagnosticReports ]; then
            cp -R ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/test-artifacts/" || true
          fi
      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  launch_and_package:
    if: github.event_name == 'workflow_dispatch' && inputs.validation != 'tests'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
    name: Alpha ${{ matrix.sdk }} validation
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1000
      - run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - uses: actions/cache@v4
        with:
          path: |
            rust/target
            rust/LibMonalRustSwiftBridge
            rust/monal-rust-swift-bridge/generated
          key: rust-ios-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/*.rs', 'rust/build-rust.sh') }}
      - name: Build Rust bridge
        run: bash rust/build-rust.sh
      - name: Install pods
        working-directory: Monal
        run: pod install --repo-update
      - name: Build and validate Alpha
        run: bash scripts/build-ios-testing.sh '${{ matrix.sdk }}'
      - name: Install, launch and monitor simulator app
        if: matrix.sdk == 'iphonesimulator'
        run: bash scripts/smoke-launch-ios.sh
      - name: Exercise unsigned package creation
        if: matrix.sdk == 'iphoneos'
        run: bash scripts/package-ios-testing.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpha-validation-${{ matrix.sdk }}
          path: |
            build/*-build.log
            build/ios-testing/launch
          retention-days: 14
